<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoboReason GUI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>RoboReason</h1>
    <div class="status">
      <span id="robot-led" class="led led-red"></span>
      <span id="robot-text">robot: unknown</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Command</h2>
      <div id="chat-history"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="e.g. pick up the red cube and place it on zone A" autocomplete="off" />
        <button id="chat-send" type="submit">Send</button>
      </form>
    </section>

    <section class="card">
      <h2>Robot connection</h2>
      <ul class="probes">
        <li><span id="probe-traj" class="dot dot-red"></span> Trajectory controller</li>
        <li><span id="probe-joints" class="dot dot-red"></span> Joint states</li>
        <li><span id="probe-io" class="dot dot-red"></span> Gripper I/O service</li>
      </ul>
    </section>

    <section class="card">
      <h2>Configuration <span class="hint">(read-only — wiring comes in Phase 2)</span></h2>
      <div class="grid">
        <label>Mode
          <select id="sel-mode" disabled></select>
        </label>
        <label>Reasoning method
          <select id="sel-reasoning" disabled></select>
        </label>
        <label>Provider
          <select id="sel-provider" disabled></select>
        </label>
        <label>Model
          <select id="sel-model" disabled></select>
        </label>
        <label>Temperature
          <input id="inp-temp" type="number" step="0.1" min="0" max="2" disabled />
        </label>
      </div>
      <p id="options-error" class="error" hidden></p>
    </section>

    <section class="card">
      <h2>Backend</h2>
      <p>ROS bridge: <code id="bridge-node">—</code></p>
      <p>Discovered nodes: <span id="node-count">—</span></p>
      <ul id="node-list"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
