# Settings of the Gazebo virtual test environment (ROBOAI-33).
#
# The objects and zones are NOT here: the world is generated from
# robo_reason_task_interface/config/scene_mock.json at launch, so the
# simulation always matches the scene the LLM mode plans on.

world_name: roboreason

camera:
  # Pose of the camera *optical* frame in base_link as [x, y, z, roll,
  # pitch, yaw] (z forward, x image right, y image down; the format the
  # real calibration prints as FIXED_CAMERA_POSE). The body `pose`
  # (Gazebo convention, +x forward) is used only if optical_pose is absent.
  # Like the real Orbbec (ROBOAI-46): at the far end of the table, half a
  # metre up, looking back along the table axis at the robot. Solved by PnP
  # from a real 1280x720 frame with the scene_mock cubes and the ChArUco
  # board in view (2.7 px mean reprojection error); the position agrees
  # within 5 cm with the logged ChArUco calibrations (-0.10, -0.88, +0.52).
  optical_pose: [-0.093, -0.934, 0.548, -2.4895, 0.0160, 0.0252]
  width: 1280
  height: 720
  horizontal_fov: 1.5250   # rad, about 87 degrees: focal 670 px at 1280 wide, from the same PnP
  update_rate: 10       # Hz
  near: 0.1
  far: 3.0

robot:
  ur_type: ur5
  # The executor's IK works in the UR controller "base" frame, which
  # ur_description rotates by pi about z from base_link. Spawning base_link
  # with this yaw makes "base" coincide with the world frame, so scene
  # coordinates, world coordinates and IK coordinates are all the same.
  spawn_yaw: 3.14159265

gripper:
  # The gripper closes "magically": the nearest cube is attached to the
  # wrist if its centre is within this distance of the TCP, otherwise the
  # gripper closes on nothing and the cube stays where it is.
  grasp_tolerance_m: 0.035
